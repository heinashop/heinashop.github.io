name: Check and deploy Sheets backend
on:
  push:
    paths: ['backend/cloudflare/**', '.github/workflows/sheets-backend.yml']
  pull_request:
    paths: ['backend/cloudflare/**', '.github/workflows/sheets-backend.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to the configured Cloudflare account (secrets must already be configured)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sheets-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    environment: cloudflare-backend
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/cloudflare/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
